<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOX</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=mSzLwFu0pFj5&format=png&color=000000"> 

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        /* 1. 기본 설정 및 스크롤 디자인 */
        html { overflow: hidden; height: 100%; }
        body {
            background-color: #F2F2F2; margin: 0; padding: 0;
            width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column; 
            cursor: none !important; 
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            font-family: 'GowoonDodum', sans-serif;
        }

        a, button, .works-link, .menu-toggle {
            cursor: none !important;
        }

        body::-webkit-scrollbar { width: 8px; }
        body::-webkit-scrollbar-track { background: #F2F2F2; }
        body::-webkit-scrollbar-thumb { background: #BCBCBC; border-radius: 10px; }
        body::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        body.no-scroll { overflow: hidden !important; }

        @font-face { font-family: 'GowoonDodum'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/GowunDodum-Regular.woff') format('woff'); }
        @font-face { font-family: 'AmoreChristmas'; src: url('fonts/Amore Christmas.otf') format('opentype'); }

        .custom-cursor { 
            width: 12px; height: 12px; border-radius: 50%; 
            background-color: black; position: fixed; 
            pointer-events: none; z-index: 9999; 
            transform: translate(-50%, -50%); transition: transform 0.1s ease-out; 
            display: none; 
        }

        /* 2. 3D 배경 및 오버레이 (속도 최적화) */
        .video-background {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
            opacity: 0; 
            /* 페이드인 속도를 1.2초로 단축 */
            transition: opacity 1.2s ease-out; 
        }
        .video-background.visible {
            opacity: 1;
        }
        
        canvas { display: block; width: 100% !important; height: 100% !important; }

        .video-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(242, 242, 242, 0.3); 
            z-index: -1;
            pointer-events: none;
        }

        /* 3. 헤더 레이아웃 */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 19px 40px; 
            width: 100%; max-width: 1920px; margin: 0 auto; box-sizing: border-box;
            z-index: 1000; position: relative; opacity: 0; transform: translateY(-10px); 
            transition: opacity 1.2s ease-out, transform 1.2s ease-out; 
        }
        header.visible { opacity: 1; transform: translateY(0); }
        .circle-icon { width: 24px; height: 24px; background-color: black; border-radius: 50%; flex-shrink: 0; }
        nav { display: flex; align-items: center; }
        nav a, .works-link { 
            font-family: 'GowoonDodum', sans-serif; text-decoration: none; color: black; 
            font-size: 1.1rem; font-weight: 500; white-space: nowrap; margin: 0; 
            margin-left: 25px; 
            line-height: 1; display: block;
        }
        .menu-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; padding: 10px; z-index: 1002; }
        .menu-toggle span { display: block; width: 25px; height: 2px; background-color: black; transition: 0.3s; }

        /* Works 드롭다운 */
        .works-dropdown-container { position: relative; display: inline-block; }
        .works-icons { 
            position: absolute; 
            top: 200%; 
            left: 50%; 
            transform: translateX(-50%); 
            margin-top: -15px;
            display: flex; flex-direction: column; gap: 10px; 
            max-height: 0; overflow: hidden; opacity: 0; padding: 0;
            transition: all 0.4s ease-out; z-index: 1001; 
        }
        .works-icons.open { max-height: 350px; opacity: 1; padding: 5px 15px 15px 15px; }
        .works-item { 
            text-decoration: none; color: black; width: 100px; height: 45px; 
            display: flex; justify-content: center; align-items: center; 
            border: 1px solid black; border-radius: 25px; background-color: #F2F2F2; 
            opacity: 0; transform: translateY(10px); transition: all 0.4s ease-out;
        }
        .works-item p { font-family: 'GowoonDodum', sans-serif; font-size: 0.9em; margin: 0; color: inherit; }
        .works-icons.open .works-item:nth-child(1) { transition-delay: 0.1s; opacity: 1; transform: translateY(0); }
        .works-icons.open .works-item:nth-child(2) { transition-delay: 0.2s; opacity: 1; transform: translateY(0); }
        .works-icons.open .works-item:nth-child(3) { transition-delay: 0.3s; opacity: 1; transform: translateY(0); }
        .works-item:hover { background-color: #dddddd; color: white; transition-delay: 0s !important; }

        /* 4. 메인 콘텐츠 */
        .main-wrapper { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 40px; text-align: center; margin-top: -30px; transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
        .title-container { position: relative; display: inline-block; opacity: 0; transform: translateY(20px); font-size: clamp(1.8rem, 12vw, 10rem); transition: opacity 1.2s ease-out, transform 1.2s ease-out, font-size 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
        .title-container.visible { opacity: 1; transform: translateY(0); }
        .main-title { font-family: 'AmoreChristmas', cursive; font-size: 1em; margin: 0; line-height: 0.85; letter-spacing: 0.01em; text-transform: lowercase; padding: 0 0.15em; }
        
        .sparkle-svg { 
            position: absolute; width: 0.3em; height: auto; z-index: -1; opacity: 0; 
            transition: opacity 1.2s ease-out 0.2s, transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        .title-container.visible .sparkle-svg { opacity: 1; }
        .sparkle-left { left: 50%; margin-left: -1.2em; top: 8%; transform: translateY(-50%) scale(0.5); }
        .title-container.visible .sparkle-left { transform: translateY(-50%) scale(1); }
        .sparkle-right { right: -0.15em; top: 93%; transform: translateY(-50%) scale(0.5); }
        .title-container.visible .sparkle-right { transform: translateY(-50%) scale(1); }
        
        .sub-info-container { margin-top: clamp(15px, 4vw, 40px); opacity: 0; transform: translateY(20px); transition: opacity 1.2s ease-out 0.2s, transform 1.2s ease-out 0.2s; }
        .sub-info-container.visible { opacity: 1; transform: translateY(0); }
        .sub-text { font-size: clamp(10px, 1.8vw, 26px); font-weight: 500; color: #333; letter-spacing: 0.05em; margin: 0; word-break: keep-all; }

        /* 5. 푸터 */
        footer { padding: 20px 40px; width: 100%; max-width: 1920px; margin: 0 auto; box-sizing: border-box; opacity: 0; transform: translateY(10px); transition: opacity 1.2s ease-out, transform 1.2s ease-out; }
        footer.visible { opacity: 1; transform: translateY(0); }
        .divider-container { display: flex; align-items: center; margin-bottom: 15px; }
        .divider-circle { width: 8px; height: 8px; background-color: #BCBCBC; border-radius: 50%; }
        .divider-line { flex-grow: 1; height: 1px; background-color: #BCBCBC; }
        .copyright { color: #555; font-size: 0.8em; text-align: right; }

        /* 6. 반응형 (모바일) */
        @media (max-width: 768px) {
            header { padding: 15px 25px; }
            .menu-toggle { display: flex; }
            nav { position: fixed; top: 0; right: -100%; width: 100%; height: 100vh; background-color: #F2F2F2; flex-direction: column; justify-content: center; transition: 0.5s ease-in-out; z-index: 1001; visibility: hidden; }
            nav.open { right: 0; visibility: visible; }
            nav a, .works-link { font-size: 1.5em; margin: 15px 0; margin-left: 0; }
            .works-dropdown-container { display: flex; flex-direction: column; align-items: center; }
            .works-icons { position: static; transform: none; opacity: 1; max-height: none; padding: 5px 0; display: flex; flex-direction: column; align-items: center; margin-top: 0; }
            .works-item { width: auto; height: auto; border: none; background: none; opacity: 1; transform: none; margin: 5px 0; }
            .works-item p { font-size: 0.75em; color: #888; }
        }
    </style>
</head>
<body>
    <div class="custom-cursor"></div>

    <div class="video-background" id="three-container"></div>
    <div class="video-overlay"></div>

    <header id="header">
        <a href="index.html" class="home-button"><div class="circle-icon"></div></a>
        <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
        <nav id="navMenu">
            <a href="about.html">About</a> 
            <a href="contact.html">Contact</a> 
            <div class="works-dropdown-container" id="worksContainer">
                <p class="works-link">Works</p>
                <div class="works-icons" id="worksIcons">
                    <a href="2d_animation.html" class="works-item"><p>2D</p></a>
                    <a href="3d_animation.html" class="works-item"><p>3D</p></a>
                    <a href="assets.html" class="works-item"><p>Assets</p></a>
                </div>
            </div>
        </nav>
    </header>

    <div class="main-wrapper">
        <div class="title-container" id="mainTitleContainer">
            <img src="images/sparkle.svg" alt="sparkle" class="sparkle-svg sparkle-left">
            <h1 class="main-title">nox<br>portfolio</h1>
            <img src="images/sparkle.svg" alt="sparkle" class="sparkle-svg sparkle-right">
        </div>
        <div class="sub-info-container" id="subInfo">
            <p class="sub-text">2D & 3D Animation Generalist</p>
        </div>
    </div>

    <footer id="footer">
        <div class="divider-container"><div class="divider-circle"></div><div class="divider-line"></div><div class="divider-circle"></div></div>
        <p class="copyright">© 2025 NOX. All rights reserved.</p>
    </footer>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        document.addEventListener('DOMContentLoaded', () => {
            const cursor = document.querySelector('.custom-cursor');
            const bgContainer = document.getElementById('three-container');
            
            document.addEventListener('pointermove', (e) => {
                // 'mouse'와 'pen'(타블렛 펜)일 때 모두 커스텀 커서를 표시하도록 수정
                if (e.pointerType === 'mouse' || e.pointerType === 'pen') {
                    cursor.style.display = 'block';
                    cursor.style.left = `${e.clientX}px`;
                    cursor.style.top = `${e.clientY}px`;
                } else {
                    cursor.style.display = 'none';
                }
            });

            document.addEventListener('pointerleave', () => {
                cursor.style.display = 'none';
            });

            // 타이밍 최적화: 더 빠르게 페이드인 시작
            setTimeout(() => { bgContainer.classList.add('visible'); }, 50); 
            setTimeout(() => { document.getElementById('header').classList.add('visible'); }, 100);
            setTimeout(() => { 
                document.getElementById('mainTitleContainer').classList.add('visible'); 
                document.getElementById('footer').classList.add('visible');
            }, 300);
            setTimeout(() => { document.getElementById('subInfo').classList.add('visible'); }, 600);

            const menuToggle = document.getElementById('menuToggle');
            const navMenu = document.getElementById('navMenu');
            const worksContainer = document.getElementById('worksContainer');
            const worksIcons = document.getElementById('worksIcons');
            const worksLink = document.querySelector('.works-link');

            function toggleScroll() {
                if (navMenu.classList.contains('open') && window.innerWidth <= 768) {
                    document.body.classList.add('no-scroll');
                } else {
                    document.body.classList.remove('no-scroll');
                }
            }

            menuToggle.addEventListener('click', () => {
                navMenu.classList.toggle('open');
                toggleScroll();
            });

            worksLink.addEventListener('click', (e) => {
                e.stopPropagation();
                worksIcons.classList.toggle('open');
            });

            worksContainer.addEventListener('mouseleave', () => {
                if (window.innerWidth > 768) {
                    worksIcons.classList.remove('open');
                }
            });

            document.addEventListener('click', (e) => {
                if (!menuToggle.contains(e.target) && !navMenu.contains(e.target)) {
                    navMenu.classList.remove('open');
                    worksIcons.classList.remove('open');
                    document.body.classList.remove('no-scroll');
                }
            });

            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    document.body.classList.remove('no-scroll');
                }
            });

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xF2F2F2); 

            const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 픽셀비 과도한 방지
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2; 

            bgContainer.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 2.0));
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
            sunLight.position.set(5, 10, 7.5);
            scene.add(sunLight);

            let model;
            const loader = new GLTFLoader();
            loader.load('interactive/fairytale_garden.glb', (gltf) => {
                model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                model.position.sub(center); 
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.z = maxDim * 0.7; 
                scene.add(model);
            });

            let mouseX = 0, mouseY = 0;
            window.addEventListener('pointermove', (e) => {
                mouseX = (e.clientX / window.innerWidth) - 0.5;
                mouseY = (e.clientY / window.innerHeight) - 0.5;
            });

            function animate() {
                requestAnimationFrame(animate);
                if (model) {
                    model.rotation.y += (mouseX * 0.5 - model.rotation.y) * 0.05;
                    model.rotation.x += (mouseY * 0.2 - model.rotation.x) * 0.05;
                }
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
